<!doctype html>
<!-- The terminals of the Code panel: one xterm.js per shell, only the one chosen shown. Python (window.bridge,
     ornis_core/terminal.py) runs the shells; QML says which one to show and the colours (show(), theme()). -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../vendor/xterm.css">
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="../vendor/xterm.js"></script>
<script src="../vendor/xterm-fit.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--bg, #0b1120); overflow: hidden; }
  .term { position: absolute; inset: 10px 6px 6px 14px; display: none; }
  .term.on { display: block; }
  .xterm .xterm-viewport { scrollbar-width: thin; scrollbar-color: var(--line, #334) transparent; background: transparent !important; }
</style>
</head>
<body>
<script>
  const terms = {}            // id -> {term, fit, el}
  let current = "", bridge = null, palette = null, queue = []

  function theme(p) {
    palette = p
    document.documentElement.style.setProperty("--bg", p.background)
    document.documentElement.style.setProperty("--line", p.line)
    for (const id in terms) terms[id].term.options.theme = p
  }
  function make(id) {
    const el = document.createElement("div")
    el.className = "term"
    document.body.appendChild(el)
    const term = new Terminal({
      fontFamily: '"JetBrains Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace',
      fontSize: 13, lineHeight: 1.25, cursorBlink: true, cursorStyle: "bar", allowProposedApi: false,
      scrollback: 8000, theme: palette || undefined, macOptionIsMeta: true,
    })
    const fit = new FitAddon.FitAddon()
    term.loadAddon(fit)
    term.open(el)
    term.onData(d => bridge && bridge.write(id, d))
    term.onResize(({ cols, rows }) => bridge && bridge.resize(id, cols, rows))
    terms[id] = { term, fit, el }
    if (bridge) bridge.history(id, text => { if (text) term.write(text) })
    return terms[id]
  }
  function show(id) {
    if (!bridge) { queue.push(id); return }
    const t = terms[id] || make(id)
    for (const other in terms) terms[other].el.classList.toggle("on", other === id)
    current = id
    requestAnimationFrame(() => { try { t.fit.fit() } catch (e) {} ; t.term.focus() })
  }
  function drop(id) {
    const t = terms[id]
    if (!t) return
    t.term.dispose(); t.el.remove(); delete terms[id]
  }
  function focusTerm() { if (terms[current]) terms[current].term.focus() }
  window.addEventListener("resize", () => { if (terms[current]) try { terms[current].fit.fit() } catch (e) {} })
  new QWebChannel(qt.webChannelTransport, channel => {
    bridge = channel.objects.bridge
    bridge.output.connect((id, text) => { const t = terms[id]; if (t) t.term.write(text) })
    bridge.exited.connect((id, code) => { const t = terms[id]; if (t) t.term.write("\r\n\x1b[2m— " + (window.ended || "ended") + " —\x1b[0m\r\n") })
    const waiting = queue; queue = []
    waiting.forEach(show)
  })
</script>
</body>
</html>
