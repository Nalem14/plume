# Plume for Windows, macOS and Linux (plume/README.md): built from the same files as the apps of Orneos OS
# (os/files/usr/share/orneos*), checked (--self-test: every module's view, Chromium, the keychain, the fonts), then
# attached to a draft GitHub release (each build puts its files there itself: no Actions artifacts, whose storage
# quota is small and blocked the 1.0.18 build). Publishing happens on the server, which signs: sh tools/plume-publish.sh <tag>.
# Source: plume/ci/plume.yml of the private repository. It runs on github.com/Nalem14/plume, a public copy of only the
# files the build needs, where GitHub's runners (macOS included) are free: sh tools/plume-ci.sh <tag> pushes it there.
# Runs on a tag plume-v<version> (must be the version of plume_core/__init__.py), plume-test-<anything> for a trial
# build, or by hand.
name: Plume
on:
  workflow_dispatch:
  push:
    tags: ['plume-v*', 'plume-test-*']

permissions:
  contents: write

concurrency:
  group: plume-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Draft release (the builds add their files to it)
        id: tag
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in plume-v*|plume-test-*) ;; *) tag="plume-build-${{ github.run_number }}" ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 ||
            gh release create "$tag" --repo "${{ github.repository }}" --draft --target "${{ github.sha }}" \
              --title "Plume ${tag#plume-}" --notes "Built at ${{ github.sha }}. Publish on the server: sh tools/plume-publish.sh $tag [--channel=unstable]"

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, label: linux }     # glibc 2.35: the AppImage runs on Ubuntu 22.04, Debian 12 and newer
          - { os: windows-2022, label: windows }
          - { os: macos-15, label: macos, arch: arm64 }              # Apple Silicon
          - { os: macos-15-intel, label: macos, arch: x86_64 }       # Intel Macs (GitHub keeps Intel runners until 08/2027)
    runs-on: ${{ matrix.os }}
    defaults:
      run: { shell: bash }
    env:
      PYTHONUTF8: '1'      # Windows: the sources are UTF-8, not the system's code page
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: System libraries (bundled into the AppImage and the .deb)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu's main archive rather than GitHub's Azure mirror: on 11/11 « azure.archive.ubuntu.com » stopped
          # resolving on the runners for hours (every Linux build failed here)
          sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g; s#azure.archive.ubuntu.com#archive.ubuntu.com#g' \
            /etc/apt/sources.list $(ls /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null) || true
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends libxcb-cursor0 libxkbcommon-x11-0 libxcb-keysyms1 \
            libxcb-shape0 libxcb-icccm4 libxcb-image0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libnss3 \
            libegl1 libgl1 libgbm1 libwayland-client0 libwayland-cursor0 libwayland-egl1 libwayland-server0 \
            libfontconfig1 libdbus-1-3 libxkbfile1 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxshmfence1 \
            rpm dpkg-dev
      - name: Python packages
        run: python -m pip install -q -r plume/requirements-build.txt
      - name: Stage (the apps, the grid of apps, fonts, icons)
        run: python plume/stage.py build/stage && echo "VERSION=$(cat build/stage/version)" >> "$GITHUB_ENV"
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/plume-v')
        run: '[ "plume-v$VERSION" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} but plume_core says $VERSION"; exit 1; }'
      - name: PyInstaller
        run: PLUME_STAGE=build/stage pyinstaller --noconfirm --log-level WARN --distpath build/dist --workpath build/work plume/plume.spec

      - name: Self-test
        env:
          # the runners have no display (Linux) or no GPU: software rendering, Chromium without its sandbox
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu
          QT_QUICK_BACKEND: software
        run: |
          case "${{ runner.os }}" in
            Linux) QT_QPA_PLATFORM=offscreen build/dist/Plume/Plume --self-test="$PWD/report.txt" || true ;;
            macOS) build/dist/Plume.app/Contents/MacOS/Plume --self-test="$PWD/report.txt" || true ;;
            Windows) powershell -Command "Start-Process -Wait -FilePath build\\dist\\Plume\\Plume.exe -ArgumentList '--self-test=$(cygpath -w "$PWD/report.txt")'" ;;
          esac
          cat report.txt
          ! grep -q FAIL report.txt

      - name: Linux packages (AppImage, .deb, .rpm)
        if: runner.os == 'Linux'
        run: |
          sh plume/linux/build.sh build/dist/Plume dist "$VERSION"
          sh plume/linux/rpm.sh build/stage dist
      - name: Windows installer (Inno Setup, per user)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist   # absolute paths: Inno resolves relative ones from the .iss folder
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" -Q "-DVersion=$VERSION" "-DBundle=$(cygpath -aw build/dist/Plume)" \
            "-DStage=$(cygpath -aw build/stage)" "-O$(cygpath -aw dist)" plume/windows/plume.iss
      - name: macOS disk image (drag Plume to Applications)
        if: runner.os == 'macOS'
        run: |
          APP=build/dist/Plume.app
          # no Apple account: PyInstaller signs the app and every library ad hoc (arm64 refuses unsigned code).
          # One DMG per processor (arm64, x86_64): the updater asks for its own (arch=, ClientUpdateController::plume).
          # A valid signature is what lets « Open Anyway » work (plume.spec leaves the frameworks whole).
          # PyInstaller leaves an empty Versions/Resources beside Versions/A in Qt's frameworks: macOS then calls the
          # framework invalid. Only empty folders go; the app's own signature is made again over the result.
          find "$APP/Contents/Frameworks" -path '*.framework/Versions/*' -maxdepth 6 -type d -empty \
            ! -name A -print -delete
          # Touch ID for the lock of Passwords (passwords_core/lock.py): beside Plume, so macOS names Plume in its dialog
          swiftc -O -target ${{ matrix.arch }}-apple-macos12 plume/macos/touchid.swift -o "$APP/Contents/MacOS/plume-touchid"
          codesign --force --sign - "$APP/Contents/MacOS/plume-touchid"
          codesign --force --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p build/dmg dist
          cp -R "$APP" build/dmg/ && ln -s /Applications build/dmg/Applications
          # the runners' disk images are sometimes still held (« Resource busy »): a few more tries
          for try in 1 2 3 4; do
            hdiutil create -volname Plume -srcfolder build/dmg -ov -format UDZO "dist/Plume-$VERSION-macos-${{ matrix.arch }}.dmg" && break
            [ "$try" = 4 ] && exit 1
            sleep 15
          done
      - name: Framework layout (diagnosis)
        if: failure() && runner.os == 'macOS'
        run: |
          F=build/dist/Plume.app/Contents/Frameworks/PySide6/Qt/lib/QtWebEngineCore.framework
          ls -la "$F" "$F"/Versions "$F"/Versions/* 2>&1 | head -60
          find "$F" -maxdepth 4 | head -80
          codesign -dvvv "$F" 2>&1 | head -20
          codesign --verify --deep --strict -vvvv build/dist/Plume.app 2>&1 | head -30
      - run: ls -la dist
      - name: Files into the draft release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release upload "${{ needs.draft.outputs.tag }}" dist/* --repo "${{ github.repository }}" --clobber
